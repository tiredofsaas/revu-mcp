[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revu-mcp"
version = "1.0.0"
description = "Unofficial Model Context Protocol (MCP) server for working with PDF drawings and markups alongside Bluebeam Revu 21 on Windows."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE.md", "TRADEMARKS.md"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
    "reportlab>=4,<5",
    "Pillow>=11,<13",
    "defusedxml>=0.7,<1",
]

[project.scripts]
revu-mcp = "bluebeam_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
norecursedirs = ["tmp", "tests/tmp", ".git", ".pytest_cache"]
